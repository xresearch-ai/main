[project]
name = "XR-DRPG"
version = "0.0.1"
description = "XResearch Drug Repurposing project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.1",
    "numpy",
    "matplotlib",
    "seaborn",
    "jinja2",
    "ipykernel",
    "duckdb==1.5.6",
    "pyarrow==23.0.1",
    "rdkit==2026.9.1",
    "fsspec[http]==2026.9.0",
]

[dependency-groups]
dev = ["ruff>=0.14,<1", "matplotlib>=3.10,<4"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
