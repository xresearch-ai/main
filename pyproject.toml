[project]
name = "XR-DRPG"
version = "0.0.1"
description = "XResearch Drug Repurposing project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "jinja2",
    "ipykernel",
    "duckdb>=1.4",
    "pyarrow>=21",
    "rdkit>=2025.9",
]

[dependency-groups]
dev = ["ruff>=0.14,<1", "matplotlib>=3.10,<4"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
